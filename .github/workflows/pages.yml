# Публикует игру из папки Main на GitHub Pages при каждом изменении ветки main.
name: Опубликовать игру

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # метка версии на всех файлах — чтобы планшет не показывал старую игру из кэша
      - run: python3 .github/scripts/stamp.py Main "${GITHUB_SHA::8}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Main
      - id: deployment
        uses: actions/deploy-pages@v4
